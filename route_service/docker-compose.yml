services:
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: graphhopper
    ports:
      - "8989:8989"
    volumes:
      - ./:/data
    entrypoint: /bin/bash
    command: -c "java -Ddw.graphhopper.datareader.file=/data/hcmc-latest.osm.pbf -Ddw.graphhopper.graph.location=/tmp/hcmc-gh -jar *.jar server /data/config.yml"
    healthcheck:
      # Pings the info endpoint to verify the server is actively accepting requests
      test: ["CMD-SHELL", "curl -f http://localhost:8989/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Gives the container 30 seconds to parse the HCMC map data
