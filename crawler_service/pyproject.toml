[project]
name = "crawler-service"
version = "0.1.0"
description = "Web crawling and extraction service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "datasketch>=1.9.0",
    "dotenv==0.9.9",
    "uvicorn>=0.40.0",
    "crawl4ai>=0.8.0",
    "playwright>=1.57.0",
    "beautifulsoup4==4.14.3",
    "soupsieve==2.8.3",
    "readability-lxml>=0.8.4.1",
    "requests==2.32.5",
    "urllib3==2.6.3",
    "pydantic==2.12.5",
    "pydantic-settings>=2.12.0",
    "underthesea>=9.2.11",
    "pyvi>=0.1.1",
    "pyvis>=0.3.2",
    "loguru>=0.7.3",
    "markdown>=3.10.2",
    "markdownify>=1.2.2",
    "travel-shared", 
]

[tool.uv.sources]
travel-shared = { workspace = true }
