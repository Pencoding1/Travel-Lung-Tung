    volumes:
      - ./ai_service/mcp_config.json:/app/mcp_config.json
      - ./ai_service/agent_thoughts:/workspace/ai_service/agent_thoughts
    environment:
      - OLLAMA_HOST=http://travel_ollama:11434
      - GEMINI_API_KEY=${GEMINI_API_KEY}
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "http://travel_ai_hub:8002"
      - "--url=neonatal-martin-unregulated.ngrok-free.dev"
    environment:
      - NGROK_AUTHTOKEN=3BVb6Vh7qzIXS9DLjz3BYfYgfL5_2Mqh7v1aKBfzgMP1sEhrQ
    ports:
      - "4041:4040"
    depends_on:
      - ai_service
