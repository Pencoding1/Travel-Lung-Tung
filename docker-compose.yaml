# Local development Compose definition for Travel Vo Lo.
#
# SECRETS: no credential is stored in this file. Sensitive values are injected
# from the environment (see .env.example). The public tunnel is disabled by
# default and starts only when the `tunnel` profile is explicitly enabled.
#
# IMAGES: every pulled image is overridable through an environment variable.
# When no verified digest exists the default keeps the tag that was already in
# use. Reproducibility still requires pinning digests (see
# docs/deployment/RUNBOOK.md).
services:
  memgraph:
    image: ${MEMGRAPH_IMAGE:-memgraph/memgraph-mage:latest}
    container_name: memgraph-db
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7444:7444"
    volumes:
      - mg_lib:/var/lib/memgraph
      - mg_log:/var/log/memgraph
    environment:
      - MEMGRAPH_HOST=memgraph-db
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 --username \"${MEMGRAPH_USER}\" --password \"${MEMGRAPH_PASSWORD}\""]
      interval: 10s

      timeout: 5s
      retries: 5
      start_period: 0s
    command: ["--log-level=TRACE", "--storage-properties-on-edges=true"]
    
  lab:
    image: ${MEMGRAPH_LAB_IMAGE:-memgraph/lab:latest}
    container_name: lab
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - memgraph
      
  graphhopper:
    build: 
      context: ./graphhopper
      dockerfile: Dockerfile
      args:
        GRAPHHOPPER_BASE_IMAGE: ${GRAPHHOPPER_BASE_IMAGE:-israelhikingmap/graphhopper:latest}
    container_name: graphhopper
    ports:
      - "127.0.0.1:8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  poi_api:
    build: 
      context: .
      dockerfile: POI_service/Dockerfile
    volumes:
      - ./POI_service:/workspace/POI_service
      - ./shared_lib:/workspace/shared_lib
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONPATH=/workspace
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - FIRESTORE_ENABLED=${FIRESTORE_ENABLED:-false}
      - GRAPHHOPPER_PROFILES=${GRAPHHOPPER_PROFILES:-car,foot,bike}
      - SAVED_ITINERARY_STORAGE_PATH=${SAVED_ITINERARY_STORAGE_PATH:-/tmp/saved_itineraries.json}
    env_file:
      - path: ./POI_service/.env
        required: false
    depends_on:
      - memgraph
      
  poi_mcp:
    build: 
      context: .
      dockerfile: POI_service/Dockerfile
    command: uv run python -m app.api.mcp.tools
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PYTHONPATH=/workspace
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - FIRESTORE_ENABLED=${FIRESTORE_ENABLED:-false}
      - GRAPHHOPPER_PROFILES=${GRAPHHOPPER_PROFILES:-car,foot,bike}
      - SAVED_ITINERARY_STORAGE_PATH=${SAVED_ITINERARY_STORAGE_PATH:-/tmp/saved_itineraries.json}
    env_file:
      - path: ./POI_service/.env
        required: false
    depends_on:
      - memgraph
      
  # The Ollama service was disabled while the AI service switched to Gemini.
  # It is intentionally not defined here; ai_service no longer reads OLLAMA_*.
  ai_service:
    build: 
      context: .                          
      dockerfile: ai_service/Dockerfile
    container_name: travel_ai_hub
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./ai_service/agent_thoughts:/workspace/ai_service/agent_thoughts
      - ai_memory:/var/lib/ai_memory
    environment:
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://poi_mcp:8001/sse}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - TYPESAFE_API_TOKEN=${TYPESAFE_API_TOKEN:-}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - JEV_MIN_CONFIDENCE=${JEV_MIN_CONFIDENCE:-0.65}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
      - JEV_POLICY_VERSION=${JEV_POLICY_VERSION:-jev_intent_policy_v1}
      - JEV_TIMEOUT_SECONDS=${JEV_TIMEOUT_SECONDS:-8.0}
      - JEV_MAX_ATTEMPTS=${JEV_MAX_ATTEMPTS:-1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - MEMORY_DB_PATH=${MEMORY_DB_PATH:-}
      - SAVED_ITINERARY_STORAGE_PATH=${SAVED_ITINERARY_STORAGE_PATH:-/var/lib/ai_memory/saved_itineraries.json}
    depends_on:
      - poi_mcp

  # Opt-in public tunnel. Disabled by default: start it explicitly with
  # `docker compose --profile tunnel up`. Requires NGROK_AUTHTOKEN and
  # NGROK_DOMAIN in the environment.
  ngrok:
    image: ${NGROK_IMAGE:-ngrok/ngrok:latest}
    profiles: ["tunnel"]
    restart: unless-stopped
    command:
      - "http"
      - "http://travel_ai_hub:8002"
      - "--url=${NGROK_DOMAIN}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4041:4040"
    depends_on:
      - ai_service
volumes:
  mg_lib:
  mg_log:
  mg_etc:
  ai_memory:
