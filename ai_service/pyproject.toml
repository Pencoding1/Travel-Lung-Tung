[project]
name = "ai-service"
version = "0.1.0"
description = "Multi-Agent service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "datasketch>=1.9.0",
    "sentence-transformers>=5.2.2",
    "torch>=2.10.0",
    "dotenv==0.9.9",
    "uvicorn>=0.40.0",
    "fastmcp>=3.1.1",
    "mcp[cli]>=1.26.0,<2",
    "requests==2.32.5",
    "urllib3==2.6.3",
    "pydantic==2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0,<3",
    "loguru>=0.7.3",
    "travel-shared", 
]

[tool.uv.sources]
travel-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ai_service uses a flat layout: a top-level `main.py` module plus the
# `domains` package. `main:app` is resolved from the process working directory
# (the Dockerfile sets WORKDIR to ai_service), so only `domains` is packaged.
[tool.hatch.build.targets.wheel]
packages = ["domains"]
