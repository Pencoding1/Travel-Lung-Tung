# Isolated Compose definition for crawler_service.
# Kept in a separate file so `docker-compose.yaml` and
# `docker-compose.integration.yaml` preserve their exact default service sets.

name: tvlt_crawler

services:
  crawler_service:
    build:
      context: .
      dockerfile: crawler_service/Dockerfile
    ports:
      - "127.0.0.1:18004:8004"
    environment:
      - CRAWLER_API_KEY=${CRAWLER_API_KEY:?CRAWLER_API_KEY is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8002,http://127.0.0.1:8002}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
