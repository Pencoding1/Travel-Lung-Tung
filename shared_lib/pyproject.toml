[project]
name = "travel-shared"
version = "0.1.1"
description = "Shared schemas, exceptions, and utilities"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv==1.2.1",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_shared"]